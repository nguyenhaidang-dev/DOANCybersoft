server:
  port: ${PORT:8081}

spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/drugstore?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 10MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect

  security:
    enabled: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: haidangbin20.04@gmail.com
    password: zbzgtcwylnnwlgyn
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: drugstore-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

jwt:
  secret-key: drugstoreJwtSecretKey2026SuperSecureAuthenticationSystemSpringBoot
  expiration: 86400000

redis:
  host: ${REDIS_HOST:localhost}
  port: ${REDIS_PORT:6379}
  password: ${REDIS_PASSWORD:}

app:
  name: Drugstore
  url: ${APP_URL:http://localhost:3000}

paypal:
  client:
    id: ${PAYPAL_CLIENT_ID:test}

aws:
  s3:
    bucketName: ${AWS_S3_BUCKET_NAME:test}
    accessKey: ${AWS_ACCESS_KEY:test}
    secretKey: ${AWS_SECRET_KEY:test}
    region: ${AWS_REGION:ap-southeast-1}
    endpointUrl: ${AWS_S3_ENDPOINT_URL:test}